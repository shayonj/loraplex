listen: ":9090"
vllm_url: "http://localhost:8000"

vllm:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  max_loras: 200
  max_lora_rank: 64

storage:
  dir: "/mnt/nvme/loraplex"
  max_size: "200GB"

origins:
  - type: huggingface
    token: "${HF_TOKEN}"

invalidation:
  ttl: "1h"

discovery:
  mode: static
  static:
    peers:
      - "10.0.0.1:9090"
      - "10.0.0.2:9090"
      - "10.0.0.3:9090"

# Hash on X-Session-ID to pin all turns of a conversation to the same vLLM node.
# Works with vLLM's --enable-prefix-caching: repeat turns hit the KV cache for
# the conversation prefix instead of recomputing it.
routing:
  hash_on: "header:X-Session-ID"
  vnodes_per_peer: 150
  forward_timeout: "5s"
  overflow_threshold: 0.8
  fallback_to_base_model: true
