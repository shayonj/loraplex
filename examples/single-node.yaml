listen: ":9090"
vllm_url: "http://localhost:8000"

vllm:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  max_loras: 200
  max_lora_rank: 64

storage:
  dir: "/mnt/nvme/loraplex"
  max_size: "100GB"

origins:
  - type: huggingface
    token: ""

invalidation:
  ttl: "1h"

discovery:
  mode: static
  static:
    peers:
      - "localhost:9090"

routing:
  hash_on: "model"
  vnodes_per_peer: 150
  forward_timeout: "5s"
  overflow_threshold: 0.8
  fallback_to_base_model: true
